# What openapi2nexus needs to know about the Interzoid weather API that its spec doesn't say.
spec: interzoid.json
service: WeatherService
description: Current US weather by zip code, from Interzoid.
# The spec declares the API key as a required query parameter, "license". It is left out of every
# input; the worker reads the key from the variable its Config names.
apiKeyParam: license
rename:
  getweatherzipcode: getWeatherByZip

# Operations written by hand, which call several of the API's operations.
operations:
  weatherForZips:
    fqn: weatherForZips
    description: Current weather for several zip codes. A workflow that calls getWeatherByZip for each, at once.
    input:
      $ref: "#/$defs/WeatherForZipsInput"
    output:
      $ref: "#/$defs/WeatherForZipsOutput"
defs:
  WeatherForZipsInput:
    type: object
    properties:
      zips:
        type: array
        items:
          type: string
        minItems: 1
    required: [zips]
    additionalProperties: false
  WeatherForZipsOutput:
    type: object
    properties:
      weather:
        description: The weather for each zip code, in the input's order.
        type: array
        items:
          $ref: "#/$defs/GetWeatherByZipOutput"
    required: [weather]

output:
  nexusrpc: weather.nexusrpc.yaml
  go: operations.gen.go
  goPackage: weather
  typesImport: github.com/temporalio/nexus-connector-openapi/apis/weather/weatherapi
  typesPackage: weatherapi
